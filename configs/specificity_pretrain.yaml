# Base specificity classifier training on the 50w enzyme-reaction table.
# Generate the feature directories first; see code/scripts/data_preprocessing/prepare_pairs.py --help.

task_type: classification

data:
  train_json: data/processed/specificity_50w/train/json
  valid_json: data/processed/specificity_50w/valid/json
  train_embedding_dir: data/processed/specificity_50w/train/pairformer
  valid_embedding_dir: data/processed/specificity_50w/valid/pairformer
  csv_path: data/inputs/specificity/tables/train.csv
  valid_csv_path: data/inputs/specificity/tables/valid.csv
  drfp_path: data/processed/specificity_50w/train/reaction_fingerprints.pkl
  max_seq_length: 700
  external_missing_policy: error
  train_external_feature_banks:
    - name: protein_pocket
      path: data/processed/specificity_50w/train/protein_pocket_mixed.npz
      include_z: true
      keys: null
  valid_external_feature_banks:
    - name: protein_pocket
      path: data/processed/specificity_50w/valid/protein_pocket_mixed.npz
      include_z: true
      keys: null

training:
  loss_type: pairwise
  batch_size: 2
  lr: 5.0e-5
  epochs: 10
  precision: bf16
  use_amp: true
  output_dir: runs/specificity_pretrain
  log_dir: runs/logs
  save_every_n_epochs: 1
  use_scheduler: true
  warmup_ratio: 0.05
  scheduler_type: cosine
  optimizer: adamw
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  max_grad_norm: 1.0
  empty_cache_interval: 0
  pairwise_weight: 1.0

distributed:
  num_gpus: 1
  master_port: 29501

model:
  c_s: 384
  c_z: 128
  hidden_size: 384
  dropout: 0.1
  pairformer_blocks: 2
  n_heads: 8
  n_heads_single: 8
  n_heads_pair: 4
  blocks_per_ckpt: 1
  use_compressed: true
  use_drfp: true
  drfp_dim: 2048
  drfp_injection: z_pair_pre_pairformer_global
  drfp_pair_scale_init: 1.0
  pooling_mode: ligand_plus_global
  global_pool_scale_init: 0.35
  main_input_mode: sz
  use_extra_features: true
  extra_feature_dim: 2304
  extra_hidden_size: 384
  extra_fusion_mode: branch_gate_sum
  extra_logit_scale_init: 0.5
  extra_feature_branch_dims: [2304]
  extra_feature_branch_names: [protein_pocket]
  extra_token_injection: true
  extra_branch_scale_init: 1.0
  context_dim: 0
  context_len: 0
  context_scale_init: 1.0
  context_score_scale_init: 0.25
  overall_corr_dim: 0
  overall_corr_scale_init: 0.5
  use_context_score_bias: true
  use_overall_corr: true
  n_transformer_layers: 4

ema:
  use_ema: true
  decay: 0.999
  update_interval: 1

evaluation:
  eval_every_epoch: true

logging:
  use_swanlab: false
